      <stop offset="0.75" stop-color="#b6bbc5"/>
      <stop offset="1" stop-color="#a5acb9"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="12" x2="0" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78b5f1"/>
      <stop offset="0.45" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="smile-color" x1="24" y1="60" x2="84" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#515866"/>
      <stop offset="1" stop-color="#333b49"/>
    </linearGradient>
    <!-- True offset of the two circular faces; keeps all paper layers out of the transparent gap. -->
    <mask id="notch-clearance" maskUnits="userSpaceOnUse" x="-40" y="-40" width="240" height="240" style="mask-type:luminance">

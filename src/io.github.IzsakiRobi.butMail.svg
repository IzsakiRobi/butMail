  <title id="title">butMail — Smile, top-left fit · refined folds</title>
  <desc id="desc">The matching upper-left variant of the accepted close-fitting butMail icon. One pixel of top and left clearance, with the same proportional size, lower baseline, readable at-sign, tapered edge light and materials. Nothing but mail.</desc>

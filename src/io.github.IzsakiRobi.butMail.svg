<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1024" height="1024" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">butMail — Smile, fitted at-sign</title>
  <desc id="desc">The original smiling white envelope, unchanged, with its blue at-sign fitted into the existing notch and approximately three pixels of transparent clearance at 128px. Nothing but mail.</desc>
  <defs>
    <path id="envelope-shape" d="M 24,36 H 66 C 68.209,36 70,37.791 70,40 V 43 C 70,60 83,72 100,72 H 108 C 110.209,72 112,73.791 112,76 V 100 C 112,106.627 106.627,112 100,112 H 24 C 17.373,112 12,106.627 12,100 V 48 C 12,41.373 17.373,36 24,36 Z"/>
    <path id="at-shape" d="M 85,99.52 C 78.63,103.12 71.38,105 64,105 C 40.252,105 21,85.748 21,62 C 21,38.252 40.252,19 64,19 C 87.748,19 107,38.252 107,62 C 107,75 101,83 92,83 C 84,83 80,77 82,65 L 85,45 M 83,53 C 79,46 69,44 61,47 C 50,51 45,62 48,72 C 51,82 63,84 72,77 C 79,72 81,62 83,53"/>
    <linearGradient id="paper" x1="0" y1="36" x2="0" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#e6e7eb"/>
    </linearGradient>
    <linearGradient id="paper-profile" x1="12" y1="0" x2="112" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c0c3cb"/>
      <stop offset="0.3" stop-color="#d2d4db"/>
      <stop offset="0.75" stop-color="#b6bbc5"/>
      <stop offset="1" stop-color="#a5acb9"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="12" x2="0" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78b5f1"/>
      <stop offset="0.45" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="smile-color" x1="24" y1="60" x2="84" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#515866"/>
      <stop offset="1" stop-color="#333b49"/>
    </linearGradient>
  </defs>
  <g id="paper-edge" inkscape:groupmode="layer" inkscape:label="01 · Paper thickness">
    <use xlink:href="#envelope-shape" fill="url(#paper-profile)" transform="translate(0 4)"/>
  </g>
  <g id="envelope" inkscape:groupmode="layer" inkscape:label="02 · White envelope">
    <use xlink:href="#envelope-shape" fill="url(#paper)" stroke="#c6cad2" stroke-width="0.8"/>
    <path id="lower-left-fold" d="M 17,104 L 34,88" fill="none" stroke="#d8dbe1" stroke-width="1.2" stroke-linecap="round"/>
    <path id="lower-right-fold" d="M 107,104 L 92,90" fill="none" stroke="#d1d5dc" stroke-width="1.2" stroke-linecap="round"/>
    <path id="top-fold" d="M 24,36.5 H 66 C 68,36.5 69.5,38 69.5,40 V 43 C 69.5,58 80,68.5 91,71 C 79,78 73,82 64,82 C 49,82 36,71 26,59 L 13,47 C 13.5,41 18,36.5 24,36.5 Z" fill="#ffffff"/>
    <path id="lower-edge-light" d="M 23,110.5 H 100 C 104.5,110.5 108.5,107.5 110,103.5" fill="none" stroke="#ffffff" stroke-opacity="0.66" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g id="smile" inkscape:groupmode="layer" inkscape:label="03 · Smiling fold" fill="none" stroke-linecap="round">
    <path d="M 27,60.5 C 40,75.5 51,83.5 64,83.5 C 71,83.5 77,81.5 82,78.5" stroke="#ffffff" stroke-width="5.2"/>
    <path d="M 27,59 C 40,74 51,82 64,82 C 71,82 77,80 82,77" stroke="url(#smile-color)" stroke-width="4.8"/>
  </g>
  <g id="blue-at" inkscape:groupmode="layer" inkscape:label="04 · Blue at-sign" transform="translate(65.952 11.512) scale(0.532 0.492)" fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <use xlink:href="#at-shape" stroke="#1c71d8" transform="translate(0 4)"/>
    <use xlink:href="#at-shape" stroke="url(#blue)"/>
    <path d="M 21.1,59 C 22.6,36 41,19 64,19 C 81,19 96,29 103,43" stroke="#b9dcff" stroke-width="1.5" stroke-opacity="0.65" transform="translate(0 -6.1)"/>
  </g>
</svg>

<!doctype html>
<html @THEME@>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'">
<style>
:root { color-scheme: light; background: white; color: #202020; }
:root[data-dark] { color-scheme: dark; background: #1d1d20; color: #ffffff; }
body { margin: 16px; min-height: calc(100vh - 32px); font: 11pt sans-serif; overflow-wrap: anywhere; }
img { max-width: 100%; height: auto; }
a { color: #3584e4; }
</style>
</head>
<body>@CONTENT@</body>
</html>
